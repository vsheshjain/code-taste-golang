<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
  <marker id="in" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  <marker id="out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  <style>
    .lbl { font-size: 17px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .sub { font-size: 12px; fill: #475569; text-anchor: middle; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .subl { font-size: 12px; fill: #475569; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .ext { font-size: 13px; fill: #1e293b; text-anchor: middle; font-weight: 600; }
    .dep { stroke: #334155; stroke-width: 1.6; }
    .io  { stroke: #64748b; stroke-width: 1.4; fill: none; }
    .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; }
  </style>
</defs>
