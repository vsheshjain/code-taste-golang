<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  <style>
    .t  { font-size: 16px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .p  { font-size: 12px; fill: #334155; text-anchor: middle; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .n  { font-size: 12px; fill: #475569; text-anchor: middle; }
    .k  { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-anchor: middle; }
    .ln { stroke: #475569; stroke-width: 1.5; fill: none; }
    .ext { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; }
  </style>
</defs>
<rect width="1200" height="600" fill="#ffffff"/>
<text x="30" y="40" class="t" font-size="20" style="text-anchor:start">One request, and where each DTO lives</text>
<text x="30" y="62" style="font-size:13px;fill:#475569">every edge translates its own shapes;</text>
<text x="30" y="80" style="font-size:13px;fill:#475569">the domain never sees JSON, protobuf, SQL rows or vendor payloads</text>

<rect x="30" y="270" width="120" height="60" rx="12" class="ext"/><text x="90" y="305" class="t">Client</text>
<rect x="200" y="240" width="210" height="120" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
<text x="305.0" y="268" class="t">delivery/rest</text>
<text x="305.0" y="288" class="p">decode · call · encode</text>
<text x="305.0" y="304" class="p">errors → status</text>
<rect x="470" y="240" width="210" height="120" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
<text x="575.0" y="268" class="t">service/listsvc</text>
<text x="575.0" y="288" class="p">use case</text>
<text x="575.0" y="304" class="p">ports.go: Store,</text>
<text x="575.0" y="320" class="p">Summarizer</text>
<rect x="490" y="420" width="170" height="74" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
<text x="575.0" y="448" class="t">domain/listdom</text>
<text x="575.0" y="468" class="p">List · rules · errors</text>
<rect x="770" y="160" width="190" height="92" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.4"/>
<text x="865.0" y="188" class="t">repo/listrepo</text>
<text x="865.0" y="208" class="p">implements Store</text>
<rect x="770" y="350" width="190" height="92" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
<text x="865.0" y="378" class="t">gateway/openaigw</text>
<text x="865.0" y="398" class="p">implements Summarizer</text>
<rect x="1020" y="176" width="140" height="60" rx="12" class="ext"/><text x="1090" y="211" class="t">Postgres</text>
<rect x="1020" y="366" width="140" height="60" rx="12" class="ext"/><text x="1090" y="401" class="t">OpenAI</text>
<line x1="152" y1="300" x2="198" y2="300" class="ln" marker-end="url(#a)"/>
<text x="175.0" y="292" class="n">JSON</text>
<line x1="412" y1="300" x2="468" y2="300" class="ln" marker-end="url(#a)"/>
<text x="440.0" y="292" class="n">Go values</text>
<line x1="575" y1="362" x2="575" y2="418" class="ln" marker-end="url(#a)"/><text x="585" y="395" class="n" style="text-anchor:start">calls rules on</text>
<path d="M682,280 C725.0,280 725.0,206 768,206" class="ln" marker-end="url(#a)"/>
<text x="712" y="228" class="n">Store port</text>
<path d="M682,320 C725.0,320 725.0,396 768,396" class="ln" marker-end="url(#a)"/>
<text x="722" y="452" class="n">Summarizer port</text>
<line x1="962" y1="206" x2="1018" y2="206" class="ln" marker-end="url(#a)"/>
<text x="990.0" y="198" class="n">SQL</text>
<line x1="962" y1="396" x2="1018" y2="396" class="ln" marker-end="url(#a)"/>
<text x="990.0" y="388" class="n">HTTPS</text>
<rect x="195" y="470" width="220" height="74" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="305.0" y="487" class="k" fill="#2563eb">WIRE DTO</text>
<text x="305.0" y="505" class="p">delivery/rest/dto.go</text>
<text x="305.0" y="521" class="p">createListRequest</text>
<text x="305.0" y="537" class="p">listResponse</text>
<rect x="470" y="130" width="210" height="58" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="575.0" y="147" class="k" fill="#16a34a">PORT DTO</text>
<text x="575.0" y="165" class="p">listsvc/ports.go</text>
<text x="575.0" y="181" class="p">SummaryRequest · Summary</text>
<rect x="770" y="58" width="190" height="58" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="865.0" y="75" class="k" fill="#4f46e5">ROW</text>
<text x="865.0" y="93" class="p">unexported in listrepo</text>
<text x="865.0" y="109" class="p">listRow</text>
<rect x="770" y="470" width="190" height="58" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="865.0" y="487" class="k" fill="#7c3aed">VENDOR SHAPE</text>
<text x="865.0" y="505" class="p">unexported in openaigw</text>
<text x="865.0" y="521" class="p">chatRequest</text>
<line x1="305" y1="472" x2="305" y2="362" stroke="#2563eb" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="575" y1="190" x2="575" y2="238" stroke="#16a34a" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="865" y1="132" x2="865" y2="160" stroke="#4f46e5" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="865" y1="470" x2="865" y2="444" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3 3"/>
<text x="575" y="514" class="n">no struct tags, no DTOs</text>
<text x="30" y="576" style="font-size:12px;fill:#475569">grpcapi/ and consumer/ follow the same shape as rest/: protobuf types or message structs are their wire DTOs.</text>
</svg>